[env:teensy41]
platform= teensy
board= teensy41
framework= arduino

board_build.f_cpu= 600000000L

build_flags=
    -Os
    -ffunction-sections
    -fdata-sections
    -DACADOS_WITH_HPIPM
    -DBLASFEO_TARGET_GENERIC
    -I include
    -I include/acados
    -I include/acados_c
    -I include/blasfeo/include
    -I include/hpipm/include
	-Wl,--wrap=malloc,--wrap=free,--wrap=calloc

build_unflags=
    -std=gnu++14

extra_scripts= pre:fix_ld.py